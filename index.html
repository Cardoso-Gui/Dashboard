<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f8fb">
  <title>Dashboard Interativo</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8fbff,#eef5f7);color:#102033;padding:24px}
    main{width:min(1100px,100%);text-align:center}
    h1{font-size:clamp(2.2rem,6vw,4rem);margin:0;letter-spacing:-.05em}
    h1 span{display:block;color:#2585e7}
    p{color:#66788c;margin:14px auto 32px;max-width:680px}
    .choices{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center}
    .card{min-height:330px;border-radius:28px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#fff;text-decoration:none;box-shadow:0 24px 60px rgba(20,45,70,.18);transition:.25s ease;overflow:hidden;position:relative}
    .card:hover{transform:translateY(-8px) scale(1.015);box-shadow:0 32px 70px rgba(20,45,70,.25)}
    .pxg{background:linear-gradient(145deg,#0b3c22,#1d6a37 55%,#84c96e)}
    .pstory{background:linear-gradient(145deg,#176ca8,#35a7d8 55%,#f6d39a)}
    .card small{font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
    .card strong{font-size:clamp(2.5rem,6vw,4.2rem);line-height:1;margin:7px 0 8px}
    .card span{opacity:.9}
    .arrow{font-size:2rem;color:#7d90a2}
    .note{margin-top:24px;font-size:.88rem;color:#8a99a8}
    @media(max-width:760px){.choices{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.card{min-height:240px}}
  </style>
</head>
<body>
  <main>
    <h1>Bem-vindo ao <span>Dashboard Interativo</span></h1>
    <p>Escolha sua jornada. Esta é a base publicada do projeto; os dashboards completos de PXG e PStory serão conectados aqui.</p>
    <div class="choices">
      <a class="card pxg" href="./pxg/">
        <small>Jornada hardcore</small>
        <strong>PXG</strong>
        <span>Acessar dashboard →</span>
      </a>
      <div class="arrow">↔</div>
      <a class="card pstory" href="./pstory/">
        <small>Jornada PStory</small>
        <strong>PStory</strong>
        <span>Acessar dashboard →</span>
      </a>
    </div>
    <div class="note">Dashboard Interativo • base do GitHub Pages</div>
  </main>
</body>
</html>
