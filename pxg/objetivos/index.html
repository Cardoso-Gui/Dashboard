<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07140d"><title>Objetivos • PXG</title>
<style>
:root{--text:#f4faef;--muted:#abc3ae;--lime:#a4e28e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse 45% 28% at 8% 0%,#275a33,transparent 100%),radial-gradient(ellipse 55% 55% at 95% 70%,#173a26,transparent 100%),#07140d}
button{font:inherit;cursor:pointer}.page{width:min(1100px,100%);margin:auto;padding:25px clamp(16px,4vw,44px) 65px}
.back{color:#d4eccc;text-decoration:none;font-size:.91rem}.back:hover{text-decoration:underline}.eyebrow{color:var(--lime);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em}
header{margin:34px 0}.head-line{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:clamp(2.2rem,5vw,3.7rem);letter-spacing:-.05em;margin:8px 0}.intro{color:var(--muted);margin:0;line-height:1.5}.summary{color:#d6e9d0;border:1px solid #537a5b;border-radius:99px;padding:9px 15px;font-size:.83rem;background:#1b3c28}
section{margin-top:34px}section h2{font-size:1.35rem;letter-spacing:-.025em;margin:0 0 7px}.section-sub{color:var(--muted);font-size:.86rem;margin:0 0 16px}
.active-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.goal{min-height:190px;display:flex;flex-direction:column;padding:20px;border:1px solid #497550;border-radius:21px;background:linear-gradient(145deg,#173b26,#0e2619);box-shadow:0 18px 35px #0004}.goal .mark{font-size:1.3rem}.goal h3{font-size:1.08rem;margin:13px 0 6px}.goal p{color:#acc8ac;font-size:.83rem;margin:0;line-height:1.45}.goal .bottom{margin-top:auto;padding-top:15px}.bar{height:7px;border-radius:99px;background:#3b5d43;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#6ac577,#b9eb8d);border-radius:inherit;transition:width .3s}.progress{display:block;color:#d4ead0;font-size:.79rem;font-weight:750;margin-top:8px}.complete-button{margin-top:16px;padding:9px 12px;border:1px solid #86c483;border-radius:10px;background:#275c36;color:#f5fff2;font-size:.78rem;font-weight:750}.complete-button:hover{background:#347444}.complete-button:focus-visible,.back:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.group{padding:20px;border:1px solid #335c41;border-radius:20px;background:#112a1c}.group h3{font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;color:#b6e2a7;margin:0 0 15px}.group ul{padding:0;margin:0;list-style:none;display:grid;gap:11px}.group li{display:flex;align-items:flex-start;gap:10px;color:#e1efdc;font-size:.89rem;line-height:1.4}.undo{margin-left:auto;border:0;background:transparent;color:#a6d89d;font-size:.77rem;text-decoration:underline}.undo:hover{color:#fff}.undo:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.check{display:grid;place-items:center;width:20px;height:20px;flex:none;border-radius:50%;background:#538e58;color:#fff;font-size:.76rem;font-weight:900}
@media(max-width:730px){.active-grid,.groups{grid-template-columns:1fr}.goal{min-height:165px}.groups{gap:12px}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="../">← Voltar à visão geral</a>
<header><span class="eyebrow">PXG • Texugo do Mel</span><div class="head-line"><h1>Objetivos</h1><span class="summary" id="summary">10 concluídos</span></div><p class="intro">Próximos passos e conquistas da sua jornada hardcore.</p></header>
<section aria-labelledby="active-title"><h2 id="active-title">Em andamento</h2><p class="section-sub">Os próximos marcos para acompanhar.</p><div class="active-grid" id="active-grid"></div></section>
<section aria-labelledby="done-title"><h2 id="done-title">Concluídos</h2><p class="section-sub">Tudo o que você já conquistou.</p><div class="groups" id="done-groups"></div></section>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const milestones=[
    {group:'Jornada',items:['Concluir o tutorial','Evoluir Baby Cyndaquil','Chegar ao nível 20','Chegar ao nível 30']},
    {group:'Pesca',items:['Chegar à pesca 10','Chegar à pesca 25','Chegar à pesca 40','Chegar à pesca 50']},
    {group:'Dinheiro',items:['Juntar 10K','Juntar 20K']}
  ];
  let profile={level:'39',team:[{name:'Gloom'},{name:'Ditto'},{name:'Cyndaquil'}]};
  try{const saved=JSON.parse(localStorage.getItem('pxg-profile-v1'));if(saved&&typeof saved==='object')profile={...profile,...saved}}catch(_){}
  let gloomDone=false;
  try{gloomDone=localStorage.getItem('pxg-gloom-evolved-v1')==='true'}catch(_){}
  const level=Math.max(0,Number.parseInt(profile.level,10)||0);
  const teamCount=(profile.team||[]).filter(member=>member?.name?.trim()).length;
  function goal(title,description,icon,progress,target,button){
    const card=document.createElement('article');card.className='goal';
    const symbol=document.createElement('span');symbol.className='mark';symbol.setAttribute('aria-hidden','true');symbol.textContent=icon;
    const heading=document.createElement('h3');heading.textContent=title;
    const detail=document.createElement('p');detail.textContent=description;
    const bottom=document.createElement('div');bottom.className='bottom';
    if(target){const bar=document.createElement('div');bar.className='bar';bar.setAttribute('aria-hidden','true');const fill=document.createElement('span');fill.style.width=Math.min(100,progress/target*100)+'%';bar.append(fill);bottom.append(bar)}
    const count=document.createElement('span');count.className='progress';count.textContent=target?progress+' / '+target: 'Planejado';bottom.append(count);
    if(button){const action=document.createElement('button');action.type='button';action.className='complete-button';action.textContent='Marcar como concluído';action.addEventListener('click',()=>{gloomDone=true;try{localStorage.setItem('pxg-gloom-evolved-v1','true')}catch(_){}render()});bottom.append(action)}
    card.append(symbol,heading,detail,bottom);return card;
  }
  function render(){
    const active=$('active-grid');active.replaceChildren();
    if(level<60)active.append(goal('Chegar ao nível 60','Próximo marco do personagem.','✦',level,60,false));
    if(!gloomDone)active.append(goal('Evoluir o Gloom','Escolher entre Vileplume e Bellossom.','🌿',0,0,true));
    if(teamCount<6)active.append(goal('Completar o time','Preencher os seis espaços do cartão.','◈',teamCount,6,false));
    if(!active.children.length){const text=document.createElement('p');text.textContent='Todos os objetivos atuais foram concluídos.';active.append(text)}
    const groups=$('done-groups');groups.replaceChildren();
    const all=milestones.map(group=>({group:group.group,items:[...group.items]}));
    if(level>=60)all[0].items.push('Chegar ao nível 60');
    if(gloomDone)all[0].items.push('Evoluir o Gloom');
    if(teamCount>=6)all[0].items.push('Completar o time');
    all.forEach(group=>{
      const panel=document.createElement('div');panel.className='group';
      const title=document.createElement('h3');title.textContent=group.group;
      const list=document.createElement('ul');
      group.items.forEach(name=>{const row=document.createElement('li');const tick=document.createElement('span');tick.className='check';tick.textContent='✓';tick.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=name;row.append(tick,label);
        if(name==='Evoluir o Gloom' && gloomDone){const undo=document.createElement('button');undo.type='button';undo.className='undo';undo.textContent='Desfazer';undo.addEventListener('click',()=>{gloomDone=false;try{localStorage.setItem('pxg-gloom-evolved-v1','false')}catch(_){}render()});row.append(undo)}
        list.append(row)});
      panel.append(title,list);groups.append(panel);
    });
    const total=all.reduce((sum,group)=>sum+group.items.length,0);
    $('summary').textContent=total+' concluído'+(total===1?'':'s');
  }
  render();
})();
</script>
</body></html>
